<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMEMBER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #0d0d0d 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .swiper {
            width: 100%;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .swiper-slide {
            width: 320px; 
            aspect-ratio: 9 / 16;
            will-change: transform; 
        }

        @media (max-width: 480px) {
            .swiper-slide {
                width: 75vw;
            }
        }

        .card-3d {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.15), inset 0 0 0 5px #222;
            transform-style: preserve-3d;
            transform: translateZ(0); 
            -webkit-backface-visibility: hidden;
            cursor: pointer;
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transform: translateZ(10px); 
            -webkit-user-drag: none;
            pointer-events: none; 
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .card-3d img.loaded {
            opacity: 1;
        }

        .card-3d video.live-video {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transform: translateZ(11px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .card-3d video.live-video.playing {
            opacity: 1;
        }

        .card-3d::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.4s ease;
            will-change: opacity;
        }

        .swiper-slide:not(.swiper-slide-active):not(.swiper-slide-next):not(.swiper-slide-prev) .card-3d::after {
            opacity: 0.85;
        }

        .zoom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.94);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="swiper">
        <div class="swiper-wrapper" id="album-wrapper"></div>
    </div>

    <div class="zoom-overlay" id="zoom-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapperEl = document.getElementById('album-wrapper');
            const overlayEl = document.getElementById('zoom-overlay');
            const maxImages = 17;
            const folder = 'album/';
            
            let isZoomed = false;
            let activeClone = null;
            let originalTarget = null;
            let holdTimer = null;

            let zPointers = [];
            let zScale = 1;
            let zPanX = 0, zPanY = 0;
            let zBasePanX = 0, zBasePanY = 0;
            let zBaseScale = 1;
            let zStartX = 0, zStartY = 0;
            let zIsDragging = false;

            function playSnippet(vid, forceMute = true) {
                vid.currentTime = 0;
                vid.muted = forceMute;
                const playPromise = vid.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        vid.classList.add('playing');
                        clearTimeout(vid.snippetTimeout);
                        vid.snippetTimeout = setTimeout(() => {
                            vid.pause();
                            vid.currentTime = 0;
                            vid.classList.remove('playing');
                        }, 2500);
                    }).catch(() => {});
                }
            }

            for (let i = 1; i <= maxImages; i++) {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'swiper-slide';

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-3d';

                const img = document.createElement('img');
                img.setAttribute('loading', 'lazy'); 
                const imgExtensions = ['png', 'jpg', 'jpeg'];
                let found = false;
                
                imgExtensions.forEach(ext => {
                  if (!found) {
                    const testImg = new Image();
                    testImg.src = `${folder}${i}.${ext}`;
                    testImg.onload = () => {
                      img.src = testImg.src;
                      found = true;
                    };
                  }
                });
                
                img.onload = () => img.classList.add('loaded');
                img.onerror = () => {
                    slideDiv.remove();
                    if (window.albumSwiper) window.albumSwiper.update();
                };

                const vid = document.createElement('video');
                vid.src = `${folder}livephoto/${i}.mp4`;
                vid.playsInline = true;
                vid.preload = 'metadata';
                vid.className = 'live-video';
                vid.muted = true;
                
                vid.onloadedmetadata = () => {
                    cardDiv.appendChild(vid);
                };

                cardDiv.appendChild(img);
                slideDiv.appendChild(cardDiv);
                wrapperEl.appendChild(slideDiv);
            }

            window.albumSwiper = new Swiper('.swiper', {
                effect: 'coverflow',
                grabCursor: true,        
                centeredSlides: true,    
                slidesPerView: 'auto',   
                speed: 600,              
                watchSlidesProgress: true, 
                coverflowEffect: {
                    rotate: 40,          
                    stretch: -15,        
                    depth: 250,          
                    modifier: 1,         
                    slideShadows: true,  
                },
                mousewheel: { enabled: true, sensitivity: 1 },
                keyboard: { enabled: true },
                on: {
                    init: function () { 
                        setTimeout(() => {
                            if (isZoomed) return;
                            const activeSlide = this.slides[this.activeIndex];
                            if(activeSlide) {
                                const vid = activeSlide.querySelector('video.live-video');
                                if(vid) playSnippet(vid, true);
                            }
                        }, 100);
                    },
                    slideChange: function () { 
                        document.querySelectorAll('video.live-video').forEach(v => {
                            v.pause();
                            v.currentTime = 0;
                            v.classList.remove('playing');
                            clearTimeout(v.snippetTimeout);
                        });
                        if (!isZoomed) {
                            const activeSlide = this.slides[this.activeIndex];
                            if(activeSlide) {
                                const vid = activeSlide.querySelector('video.live-video');
                                if(vid) playSnippet(vid, true);
                            }
                        }
                    }
                }
            });

            document.addEventListener('pointerdown', (e) => {
                if (isZoomed) return;
                const slide = e.target.closest('.swiper-slide-active');
                if (slide) {
                    const vid = slide.querySelector('video.live-video');
                    if (vid) {
                        holdTimer = setTimeout(() => {
                            playSnippet(vid, false);
                        }, 350);
                    }
                }
            });

            document.addEventListener('pointerup', () => clearTimeout(holdTimer));
            document.addEventListener('pointermove', () => clearTimeout(holdTimer));

            const calculateTargetSize = (img) => {
                const ratio = img.naturalWidth / img.naturalHeight || (320 / 568);
                const winW = window.innerWidth * 0.9;
                const winH = window.innerHeight * 0.9;
                const winRatio = winW / winH;

                let targetW, targetH;
                if (ratio > winRatio) {
                    targetW = winW;
                    targetH = winW / ratio;
                } else {
                    targetH = winH;
                    targetW = winH * ratio;
                }

                return {
                    width: targetW,
                    height: targetH,
                    top: (window.innerHeight - targetH) / 2,
                    left: (window.innerWidth - targetW) / 2
                };
            };

            const performZoom = (card) => {
                const img = card.querySelector('img');
                if (!img || !img.classList.contains('loaded')) return;

                zPointers = [];
                zScale = 1;
                zPanX = 0;
                zPanY = 0;
                zBasePanX = 0;
                zBasePanY = 0;
                zBaseScale = 1;
                zIsDragging = false;

                originalTarget = card;
                const rect = card.getBoundingClientRect();

                activeClone = card.cloneNode(true);
                
                Object.assign(activeClone.style, {
                    position: 'fixed',
                    zIndex: '9999',
                    top: `${rect.top}px`,
                    left: `${rect.left}px`,
                    width: `${rect.width}px`,
                    height: `${rect.height}px`,
                    margin: '0',
                    cursor: 'grab',
                    transition: 'none',
                    opacity: '1',
                    touchAction: 'none'
                });
                
                document.body.appendChild(activeClone);
                overlayEl.classList.add('active');
                originalTarget.style.opacity = '0';

                void activeClone.offsetWidth;

                const target = calculateTargetSize(img);

                activeClone.style.transition = 'all 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                Object.assign(activeClone.style, {
                    top: `${target.top}px`,
                    left: `${target.left}px`,
                    width: `${target.width}px`,
                    height: `${target.height}px`,
                    borderRadius: '4px'
                });
                
                const origVid = originalTarget.querySelector('video.live-video');
                if (origVid) {
                    origVid.pause();
                    origVid.classList.remove('playing');
                    clearTimeout(origVid.snippetTimeout);
                }

                const cloneVid = activeClone.querySelector('video.live-video');
                if (cloneVid) {
                    cloneVid.classList.add('playing');
                    cloneVid.muted = false;
                    cloneVid.loop = true;
                    cloneVid.currentTime = 0;
                    cloneVid.play().catch(() => {});
                }

                isZoomed = true;
                activeClone.addEventListener('pointerdown', onZPointerDown);
                activeClone.addEventListener('pointermove', onZPointerMove);
                activeClone.addEventListener('pointerup', onZPointerUp);
                activeClone.addEventListener('pointercancel', onZPointerUp);
                activeClone.addEventListener('wheel', onZWheel, { passive: false });
            };

            function applyZTransform() {
                if (!activeClone) return;
                activeClone.style.transform = `translate(${zPanX}px, ${zPanY}px) scale(${zScale})`;
            }

            function onZPointerDown(e) {
                zPointers.push({ id: e.pointerId, x: e.clientX, y: e.clientY });
                if (zPointers.length === 1) {
                    zStartX = e.clientX;
                    zStartY = e.clientY;
                    zIsDragging = true;
                    activeClone.style.transition = 'none';
                } else if (zPointers.length === 2) {
                    zIsDragging = false;
                    let d = Math.hypot(zPointers[0].x - zPointers[1].x, zPointers[0].y - zPointers[1].y);
                    activeClone.dataset.startDist = d;
                    zBaseScale = zScale;
                    zBasePanX = zPanX;
                    zBasePanY = zPanY;
                }
                activeClone.setPointerCapture(e.pointerId);
            }

            function onZPointerMove(e) {
                let idx = zPointers.findIndex(p => p.id === e.pointerId);
                if (idx > -1) {
                    zPointers[idx].x = e.clientX;
                    zPointers[idx].y = e.clientY;
                }

                if (zPointers.length === 1 && zIsDragging) {
                    if (zScale > 1) {
                        zPanX = zBasePanX + (e.clientX - zStartX);
                        zPanY = zBasePanY + (e.clientY - zStartY);
                    } else {
                        zPanX = e.clientX - zStartX;
                        zPanY = e.clientY - zStartY;
                    }
                    applyZTransform();
                } else if (zPointers.length === 2) {
                    let d = Math.hypot(zPointers[0].x - zPointers[1].x, zPointers[0].y - zPointers[1].y);
                    let startD = parseFloat(activeClone.dataset.startDist);
                    if (startD) {
                        zScale = Math.max(1, Math.min(zBaseScale * (d / startD), 5));
                        if (zScale === 1) {
                            zPanX = 0;
                            zPanY = 0;
                        }
                        applyZTransform();
                    }
                }
            }

            function onZPointerUp(e) {
                let isTap = false;
                if (zPointers.length === 1 && zIsDragging) {
                    if (Math.abs(e.clientX - zStartX) < 5 && Math.abs(e.clientY - zStartY) < 5) {
                        isTap = true;
                    }
                }

                zPointers = zPointers.filter(p => p.id !== e.pointerId);
                try { activeClone.releasePointerCapture(e.pointerId); } catch(_) {}

                if (zPointers.length === 0) {
                    if (zScale === 1) {
                        if (isTap || Math.abs(zPanX) > 60) {
                            closeZoom();
                        } else {
                            zPanX = 0;
                            zPanY = 0;
                            activeClone.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                            applyZTransform();
                            setTimeout(() => {
                                if (activeClone) activeClone.style.transition = 'none';
                            }, 300);
                        }
                    } else {
                        zBasePanX = zPanX;
                        zBasePanY = zPanY;
                        zBaseScale = zScale;
                    }
                    zIsDragging = false;
                } else if (zPointers.length === 1) {
                    zStartX = zPointers[0].x;
                    zStartY = zPointers[0].y;
                    zBasePanX = zPanX;
                    zBasePanY = zPanY;
                    zIsDragging = true;
                }
            }

            function onZWheel(e) {
                e.preventDefault();
                let zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
                zScale = Math.max(1, Math.min(zScale * zoomFactor, 5));
                if (zScale === 1) {
                    zPanX = 0;
                    zPanY = 0;
                    zBasePanX = 0;
                    zBasePanY = 0;
                }
                activeClone.style.transition = 'transform 0.1s ease-out';
                applyZTransform();
                setTimeout(() => {
                    if (activeClone) activeClone.style.transition = 'none';
                }, 100);
            }

            const closeZoom = () => {
                if (!isZoomed || !activeClone || !originalTarget) return;

                const localClone = activeClone;
                const localTarget = originalTarget;

                activeClone = null;
                originalTarget = null;
                isZoomed = false;

                overlayEl.classList.remove('active');

                const cloneVid = localClone.querySelector('video.live-video');
                if (cloneVid) cloneVid.pause();

                localClone.style.transition = 'all 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                const targetRect = localTarget.getBoundingClientRect();
                
                Object.assign(localClone.style, {
                    transform: 'scale(1) translate(0px, 0px)',
                    top: `${targetRect.top}px`,
                    left: `${targetRect.left}px`,
                    width: `${targetRect.width}px`,
                    height: `${targetRect.height}px`,
                    borderRadius: '16px'
                });

                setTimeout(() => {
                    localTarget.style.opacity = '1';
                    localClone.remove();
                }, 400);
            };

            window.albumSwiper.on('click', (swiper, e) => {
                if (isZoomed) return;
                
                const clickedSlide = e.target.closest('.swiper-slide');
                if (!clickedSlide) return;

                const card = clickedSlide.querySelector('.card-3d');
                if (!card) return;

                clearTimeout(holdTimer);
                performZoom(card);

                if (!clickedSlide.classList.contains('swiper-slide-active')) {
                    swiper.slideTo(swiper.clickedIndex);
                }
            });

            overlayEl.addEventListener('click', closeZoom);
        });
    </script>
</body>
</html>

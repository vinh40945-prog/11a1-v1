<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REMEMBER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0d0d0d;
            background-image: radial-gradient(circle at 50% 50%, #2a2a2a 0%, #0d0d0d 80%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        .swiper {
            width: 100%;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .swiper-slide {
            width: 320px; 
            aspect-ratio: 9 / 16;
            will-change: transform; 
        }

        @media (max-width: 480px) {
            .swiper-slide {
                width: 75vw;
            }
        }

        .card-3d {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.15), inset 0 0 0 5px #222;
            transform-style: preserve-3d;
            transform: translateZ(0); 
            -webkit-backface-visibility: hidden;
            cursor: pointer;
        }

        .card-3d img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transform: translateZ(10px); 
            -webkit-user-drag: none;
            pointer-events: none; 
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .card-3d img.loaded {
            opacity: 1;
        }

        .card-3d video.live-video {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transform: translateZ(11px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .card-3d video.live-video.playing {
            opacity: 1;
        }

        .card-3d::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000000;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.4s ease;
            will-change: opacity;
        }

        .card-3d.darken::after {
            opacity: 0.85; 
        }

        .zoom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.94);
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .zoom-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="swiper">
        <div class="swiper-wrapper" id="album-wrapper"></div>
    </div>

    <div class="zoom-overlay" id="zoom-overlay"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
//sửa gioi han
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapperEl = document.getElementById('album-wrapper');
            const overlayEl = document.getElementById('zoom-overlay');
            const maxImages = 17;
            const folder = 'album/';
            
            let isZoomed = false;
            let activeClone = null;
            let originalTarget = null;
            let startX = 0;
            let currentX = 0;
            let isDragging = false;
            let holdTimer = null;

            function playSnippet(vid) {
                vid.currentTime = 0;
                vid.muted = false;
                vid.play().then(() => {
                    vid.classList.add('playing');
                    clearTimeout(vid.snippetTimeout);
                    vid.snippetTimeout = setTimeout(() => {
                        vid.pause();
                        vid.currentTime = 0;
                        vid.classList.remove('playing');
                    }, 2500);
                }).catch(() => {
                    vid.muted = true;
                    vid.play().then(() => {
                        vid.classList.add('playing');
                        clearTimeout(vid.snippetTimeout);
                        vid.snippetTimeout = setTimeout(() => {
                            vid.pause();
                            vid.currentTime = 0;
                            vid.classList.remove('playing');
                        }, 2500);
                    }).catch(() => {});
                });
            }

            for (let i = 1; i <= maxImages; i++) {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'swiper-slide';

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-3d darken';

                const img = document.createElement('img');
                img.setAttribute('loading', 'lazy'); 
                const imgExtensions = ['png', 'jpg', 'jpeg'];
                let found = false;
                imgExtensions.forEach(ext => {
                  if (!found) {
                    const testImg = new Image();
                    testImg.src = `${folder}${i}.${ext}`;
                    testImg.onload = () => {
                      img.src = testImg.src;
                      found = true;
                    };
                  }
                });
                
                img.onload = () => img.classList.add('loaded');
                img.onerror = () => {
                    slideDiv.remove();
                    if (window.albumSwiper) window.albumSwiper.update();
                };

                const vid = document.createElement('video');
                vid.src = `${folder}livephoto/${i}.mp4`;
                vid.playsInline = true;
                vid.preload = 'metadata';
                vid.className = 'live-video';
                
                vid.onloadedmetadata = () => {
                    cardDiv.appendChild(vid);
                };

                cardDiv.appendChild(img);
                slideDiv.appendChild(cardDiv);
                wrapperEl.appendChild(slideDiv);
            }

            const updateFocusMode = (swiper) => {
                const slides = swiper.slides;
                slides.forEach(slide => {
                    const card = slide.querySelector('.card-3d');
                    if(card) card.classList.add('darken');
                });
                
                const active = swiper.activeIndex;
                const focusRange = [active - 2, active - 1, active, active + 1, active + 2];
                
                focusRange.forEach(index => {
                    if (slides[index]) {
                        const card = slides[index].querySelector('.card-3d');
                        if (card) card.classList.remove('darken');
                    }
                });
            };

            window.albumSwiper = new Swiper('.swiper', {
                effect: 'coverflow',
                grabCursor: true,        
                centeredSlides: true,    
                slidesPerView: 'auto',   
                speed: 600,              
                watchSlidesProgress: true, 
                coverflowEffect: {
                    rotate: 40,          
                    stretch: -15,        
                    depth: 250,          
                    modifier: 1,         
                    slideShadows: true,  
                },
                mousewheel: { enabled: true, sensitivity: 1 },
                keyboard: { enabled: true },
                on: {
                    init: function () { 
                        updateFocusMode(this); 
                        setTimeout(() => {
                            if (isZoomed) return;
                            const activeSlide = this.slides[this.activeIndex];
                            if(activeSlide) {
                                const vid = activeSlide.querySelector('video.live-video');
                                if(vid) playSnippet(vid);
                            }
                        }, 500);
                    },
                    slideChangeTransitionEnd: function () { 
                        updateFocusMode(this); 
                        document.querySelectorAll('video.live-video').forEach(v => {
                            v.pause();
                            v.currentTime = 0;
                            v.classList.remove('playing');
                            clearTimeout(v.snippetTimeout);
                        });
                        if (!isZoomed) {
                            const activeSlide = this.slides[this.activeIndex];
                            if(activeSlide) {
                                const vid = activeSlide.querySelector('video.live-video');
                                if(vid) playSnippet(vid);
                            }
                        }
                    }
                }
            });

            document.addEventListener('pointerdown', (e) => {
                if (isZoomed) return;
                const slide = e.target.closest('.swiper-slide-active');
                if (slide) {
                    const vid = slide.querySelector('video.live-video');
                    if (vid) {
                        holdTimer = setTimeout(() => {
                            playSnippet(vid);
                        }, 350);
                    }
                }
            });

            document.addEventListener('pointerup', () => clearTimeout(holdTimer));
            document.addEventListener('pointermove', () => clearTimeout(holdTimer));

            const calculateTargetSize = (img) => {
                const ratio = img.naturalWidth / img.naturalHeight || (320 / 568);
                const winW = window.innerWidth * 0.9;
                const winH = window.innerHeight * 0.9;
                const winRatio = winW / winH;

                let targetW, targetH;
                if (ratio > winRatio) {
                    targetW = winW;
                    targetH = winW / ratio;
                } else {
                    targetH = winH;
                    targetW = winH * ratio;
                }

                return {
                    width: targetW,
                    height: targetH,
                    top: (window.innerHeight - targetH) / 2,
                    left: (window.innerWidth - targetW) / 2
                };
            };

            const performZoom = (card) => {
                const img = card.querySelector('img');
                if (!img || !img.classList.contains('loaded')) return;

                originalTarget = card;
                const rect = card.getBoundingClientRect();

                activeClone = card.cloneNode(true);
                activeClone.classList.remove('darken');
                
                Object.assign(activeClone.style, {
                    position: 'fixed',
                    zIndex: '9999',
                    top: `${rect.top}px`,
                    left: `${rect.left}px`,
                    width: `${rect.width}px`,
                    height: `${rect.height}px`,
                    margin: '0',
                    cursor: 'grab',
                    transition: 'none',
                    opacity: '1',
                    touchAction: 'none'
                });
                
                document.body.appendChild(activeClone);
                overlayEl.classList.add('active');
                originalTarget.style.opacity = '0';

                void activeClone.offsetWidth;

                const target = calculateTargetSize(img);

                activeClone.style.transition = 'all 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                Object.assign(activeClone.style, {
                    top: `${target.top}px`,
                    left: `${target.left}px`,
                    width: `${target.width}px`,
                    height: `${target.height}px`,
                    borderRadius: '4px'
                });
                
                const origVid = originalTarget.querySelector('video.live-video');
                if (origVid) {
                    origVid.pause();
                    origVid.classList.remove('playing');
                    clearTimeout(origVid.snippetTimeout);
                }

                const cloneVid = activeClone.querySelector('video.live-video');
                if (cloneVid) {
                    cloneVid.classList.add('playing');
                    cloneVid.muted = false;
                    cloneVid.loop = true;
                    cloneVid.currentTime = 0;
                    cloneVid.play().catch(() => {});
                }

                isZoomed = true;
                activeClone.addEventListener('pointerdown', onPointerDown);
            };

            const switchZoomSlide = (direction) => {
                const oldClone = activeClone;
                const oldTarget = originalTarget;
                
                let newIndex = window.albumSwiper.activeIndex + (direction === 'next' ? 1 : -1);

                if (newIndex < 0 || newIndex >= window.albumSwiper.slides.length) {
                    oldClone.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                    oldClone.style.transform = 'translateX(0px)';
                    return;
                }

                const oldVid = oldClone.querySelector('video.live-video');
                if (oldVid) oldVid.pause();

                window.albumSwiper.slideTo(newIndex, 500);

                oldClone.style.transition = 'all 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                oldClone.style.opacity = '0';
                oldClone.style.transform = `translateX(${direction === 'next' ? -window.innerWidth : window.innerWidth}px) scale(0.85)`;
                setTimeout(() => oldClone.remove(), 400);

                oldTarget.style.opacity = '1';

                const newCard = window.albumSwiper.slides[newIndex].querySelector('.card-3d');
                originalTarget = newCard;
                newCard.style.opacity = '0';

                activeClone = newCard.cloneNode(true);
                activeClone.classList.remove('darken');
                
                const img = newCard.querySelector('img');
                const target = calculateTargetSize(img);

                Object.assign(activeClone.style, {
                    position: 'fixed',
                    zIndex: '9999',
                    top: `${target.top}px`,
                    left: `${target.left}px`,
                    width: `${target.width}px`,
                    height: `${target.height}px`,
                    margin: '0',
                    cursor: 'grab',
                    borderRadius: '4px',
                    opacity: '0',
                    transform: `translateX(${direction === 'next' ? window.innerWidth : -window.innerWidth}px) scale(0.85)`,
                    transition: 'none',
                    touchAction: 'none'
                });

                document.body.appendChild(activeClone);
                activeClone.addEventListener('pointerdown', onPointerDown);

                void activeClone.offsetWidth;

                activeClone.style.transition = 'all 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                activeClone.style.opacity = '1';
                activeClone.style.transform = 'translateX(0px)';

                const newVid = activeClone.querySelector('video.live-video');
                if (newVid) {
                    newVid.classList.add('playing');
                    newVid.muted = false;
                    newVid.loop = true;
                    newVid.currentTime = 0;
                    newVid.play().catch(() => {});
                }
            };

            const closeZoom = () => {
                if (!isZoomed || !activeClone || !originalTarget) return;

                const localClone = activeClone;
                const localTarget = originalTarget;

                activeClone = null;
                originalTarget = null;
                isZoomed = false;

                overlayEl.classList.remove('active');

                const cloneVid = localClone.querySelector('video.live-video');
                if (cloneVid) cloneVid.pause();

                const startRect = localClone.getBoundingClientRect();
                const startRadius = parseFloat(window.getComputedStyle(localClone).borderRadius) || 4;

                Object.assign(localClone.style, {
                    transition: 'none',
                    pointerEvents: 'none',
                    transform: 'none', 
                    top: `${startRect.top}px`,
                    left: `${startRect.left}px`,
                    width: `${startRect.width}px`,
                    height: `${startRect.height}px`
                });

                let startTime = null;
                const duration = 450;

                const animateClose = (now) => {
                    if (!startTime) startTime = now;
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);

                    const targetRect = localTarget.getBoundingClientRect();

                    Object.assign(localClone.style, {
                        top: `${startRect.top + (targetRect.top - startRect.top) * ease}px`,
                        left: `${startRect.left + (targetRect.left - startRect.left) * ease}px`,
                        width: `${startRect.width + (targetRect.width - startRect.width) * ease}px`,
                        height: `${startRect.height + (targetRect.height - startRect.height) * ease}px`,
                        borderRadius: `${startRadius + (16 - startRadius) * ease}px`
                    });

                    if (progress < 1) {
                        requestAnimationFrame(animateClose);
                    } else {
                        localTarget.style.opacity = '1';
                        localClone.remove();
                    }
                };
                
                requestAnimationFrame(animateClose);
            };

            function onPointerDown(e) {
                startX = e.clientX;
                currentX = startX;
                isDragging = true;
                activeClone.style.transition = 'none';
                activeClone.style.cursor = 'grabbing';
                activeClone.setPointerCapture(e.pointerId);
                
                activeClone.addEventListener('pointermove', onPointerMove);
                activeClone.addEventListener('pointerup', onPointerUp);
                activeClone.addEventListener('pointercancel', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                currentX = e.clientX;
                const deltaX = currentX - startX;

                activeClone.style.transform = `translateX(${deltaX}px)`;
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;
                activeClone.style.cursor = 'grab';
                activeClone.releasePointerCapture(e.pointerId);
                
                activeClone.removeEventListener('pointermove', onPointerMove);
                activeClone.removeEventListener('pointerup', onPointerUp);
                activeClone.removeEventListener('pointercancel', onPointerUp);

                const deltaX = currentX - startX;
                const swipeThreshold = window.innerWidth * 0.15; 

                if (deltaX < -swipeThreshold) {
                    switchZoomSlide('next'); 
                } else if (deltaX > swipeThreshold) {
                    switchZoomSlide('prev'); 
                } else {
                    activeClone.style.transition = 'transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
                    activeClone.style.transform = 'translateX(0px)';

                    if (Math.abs(deltaX) < 4) {
                        closeZoom();
                    }
                }
            }

            window.albumSwiper.on('click', (swiper, e) => {
                if (isZoomed) return;
                
                const clickedSlide = e.target.closest('.swiper-slide');
                if (!clickedSlide) return;

                const card = clickedSlide.querySelector('.card-3d');
                if (!card) return;

                clearTimeout(holdTimer);
                performZoom(card);

                if (!clickedSlide.classList.contains('swiper-slide-active')) {
                    swiper.slideTo(swiper.clickedIndex);
                }
            });

            overlayEl.addEventListener('click', closeZoom);
        });
    </script>
</body>
</html>
